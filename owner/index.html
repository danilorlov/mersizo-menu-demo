<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mersizo Cabinet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: боковое меню на компьютере и верхняя лента на телефоне; сверху фильтры, ниже деньги, затем детали. */
:root{--bg:#f7f5fb;--s:#fff;--s2:#f1ecf9;--line:#e6e0f0;--ink:#16091f;--muted:#655a72;--a:#6a1fb8;--a2:#ba66ff;--deep:#2c014f;--on:#fff;--good:#0f7a55;--bad:#c2410c;--warn:#a86a00;--h:'Geologica',system-ui,sans-serif;--t:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130a1c;--s:#1e1329;--s2:#2a1c38;--line:#392a49;--ink:#f4eefb;--muted:#b5a8c4;--a:#c58bff;--a2:#ba66ff;--deep:#2c014f;--on:#1a0a29;--good:#6fd9b2;--bad:#ff9d6e;--warn:#f0bd5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#130a1c;--s:#1e1329;--s2:#2a1c38;--line:#392a49;--ink:#f4eefb;--muted:#b5a8c4;--a:#c58bff;--a2:#ba66ff;--deep:#2c014f;--on:#1a0a29;--good:#6fd9b2;--bad:#ff9d6e;--warn:#f0bd5e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--t);font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
.side{background:linear-gradient(var(--deep),#5b1a99);color:#fff;padding:20px 12px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px}
.logo{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:6px;display:flex}
.logo svg{height:24px;width:auto}
.rest{font:700 15px var(--h);padding:10px 12px 12px}
.rest small{display:block;font:400 12px var(--t);opacity:.8}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;font:500 15px var(--h);text-align:left;white-space:nowrap}
.nav button[aria-current="page"]{background:#fff;color:var(--deep)}
.nav button:not([aria-current="page"]):hover{background:rgba(255,255,255,.14)}
.sfoot{margin-top:auto;font-size:12px;opacity:.82;padding:12px}
.main{min-width:0;padding:20px max(24px,env(safe-area-inset-right,0px)) 48px 24px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
.bar h1{font:700 26px/1.15 var(--h);margin-right:auto}
.seg{display:flex;background:var(--s);border:1px solid var(--line);border-radius:90px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{min-height:36px;padding:0 13px;border-radius:90px;font:500 14px var(--h);white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--a);color:var(--on)}
.dates{display:flex;flex-wrap:wrap;gap:8px}
.dates label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dates input{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:90px;background:var(--s);color:var(--ink)}
.demo{background:var(--s2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.k{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.k small{display:block;color:var(--muted);font-size:13px}
.k b{display:block;font:700 25px/1.2 var(--h);margin-top:4px;overflow-wrap:anywhere}
.k.hero{background:linear-gradient(135deg,var(--deep),#7a2fd0);color:#fff;border:0}
.k.hero small{color:#e6d6fb}
.d{font-size:13px;font-weight:600;margin-top:2px;display:block}
.up{color:var(--good)}.dn{color:var(--bad)}
.k.hero .up,.k.hero .dn{color:#fff}
.g2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;margin-top:12px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.c{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.c h2{font:700 16px/1.25 var(--h);margin-bottom:10px}
.c h2 small{font:400 13px var(--t);color:var(--muted);margin-left:6px}
.chart{width:100%;height:auto;display:block}
.heat{display:grid;grid-template-columns:30px repeat(15,minmax(0,1fr));gap:2px;font-size:11px;color:var(--muted)}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--a2);display:block}
.heat span{text-align:center;overflow:hidden}
.rows{display:grid;gap:8px}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;font-size:14px;text-align:left;width:100%}
.r span{min-width:0;overflow-wrap:anywhere}
.r b{font-weight:600}
.r .m{grid-column:1/-1;height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.r .m i{display:block;height:100%;background:var(--a);border-radius:3px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.leg{display:grid;gap:6px;margin-top:10px;font-size:14px}
.leg div{display:flex;justify-content:space-between;gap:12px}
.leg u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;text-decoration:none}
.ins{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ins li{background:var(--s2);border-radius:12px;padding:10px 12px;font-size:14px}
.ins b{font-weight:600}
.live{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;background:var(--s);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:12px;font-size:14px}
.live b{font:700 16px var(--h)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.t{position:relative;border-radius:16px;padding:10px 12px;text-align:left;min-height:96px;border:1px solid var(--line);background:var(--s);display:flex;flex-direction:column;gap:2px}
.t:hover{border-color:var(--a)}
.t b{font:700 15px var(--h)}
.t strong{font:700 16px var(--h);margin-top:auto}
.t small{font-size:12px;color:var(--muted)}
.st{position:absolute;right:10px;top:12px;width:10px;height:10px;border-radius:50%}
.st.free{background:var(--line)}.st.busy{background:var(--a2)}.st.pay{background:#f6b10a}
.leg2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 12px}
.leg2 .st{position:static;display:inline-block;margin-right:6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{font:500 13px var(--t);color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th button{font:inherit;color:inherit}
th[aria-sort] button{color:var(--a);font-weight:600}
td{padding:10px;text-align:right;border-bottom:1px solid var(--line)}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--s2)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:90px;background:var(--s2);white-space:nowrap}
.tag.good{color:var(--good)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.a{color:var(--a)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.q{flex:1 1 200px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:90px;background:var(--bg)}
.rev{display:grid;gap:10px}
.rv{border-bottom:1px solid var(--line);padding-bottom:10px}
.rv:last-child{border-bottom:0}
.rv div{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.stars{color:#d98e00;letter-spacing:1px}
.scrim{position:fixed;inset:0;background:rgba(20,8,32,.5);z-index:20}
.dr{position:fixed;z-index:21;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 32px 20px;display:grid;gap:12px;align-content:start}
.dr h2{font:700 22px var(--h);padding-right:48px}
.x{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:var(--s);border:1px solid var(--line);font-size:20px}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini .k b{font-size:20px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
@media(max-width:780px){
.shell{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:0;z-index:10;height:auto;flex-direction:column;padding:10px 0 8px;gap:8px}
.logo{margin:0;padding:6px 10px;border-radius:10px}.logo svg{height:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(16px,env(safe-area-inset-left,0px))}
.rest{padding:0;text-align:right;font-size:13px}.sfoot{display:none}
.nav{flex-direction:row;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.nav button{min-height:40px;padding:0 12px;font-size:14px}.nav svg{display:none}
.main{padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.bar h1{width:100%;font-size:22px}
.k{padding:12px}.k b{font-size:20px}
.heat{font-size:9px;grid-template-columns:22px repeat(15,minmax(0,1fr))}
}
@media(min-width:781px){.head{display:contents}}
</style>
</head>

function barChart(pts){

function vStaff(){
 const a=sel(),m=new Map();a.forEach(c=>{const o=m.get(c.w)||{name:c.w,b:c.b,s:0,n:0,tip:0,qs:0,dur:0,r:0,rn:0};o.s+=c.sum;o.n++;o.tip+=c.tip;if(c.qr)o.qs+=c.sum;o.dur+=c.dur;if(c.rate){o.r+=c.rate;o.rn++}m.set(c.w,o)});
 const l=[...m.values()].map(o=>({...o,avg:o.s/o.n,tp:o.tip/(o.qs||1)*100,rt:o.rn?o.r/o.rn:0,t:o.dur/o.n}));
 return `<section class="c">${table('w',[{k:'name',l:t('wn')},{k:'s',l:t('rev'),f:r=>lei(r.s)},{k:'n',l:t('checks'),f:r=>fmt(r.n)},{k:'avg',l:t('avg'),f:r=>lei(r.avg)},{k:'tip',l:t('tips'),f:r=>lei(r.tip)},{k:'tp',l:t('tipp'),f:r=>r.tp.toFixed(1).replace('.',',')+'%'},{k:'rt',l:t('rate'),f:r=>r.rt?r.rt.toFixed(2).replace('.',','):'-'}],l,r=>`class="cl" data-waiter="${esc(r.name)}"`)}</section>`}
let GC=null;
function guests(){if(GC&&GC.key===ST.b)return GC.v;const m=new Map();C.forEach(c=>{if(ST.b!=='all'&&String(c.b)!==ST.b)return;const o=m.get(c.g)||{id:c.g,mask:'••'+GID[c.g],v:0,s:0,last:99,it:new Map()};o.v++;o.s+=c.sum;o.last=Math.min(o.last,c.d);c.items.forEach(i=>o.it.set(i,(o.it.get(i)||0)+1));m.set(c.g,o)});
 const l=[...m.values()],th=[...l].sort((a,b)=>b.s-a.s)[Math.floor(l.length*.05)]?.s||1e9;
 l.forEach(g=>{g.seg=g.last>21&&g.v>=3?'lost':g.s>=th?'vip':g.v>=6?'reg':g.v===1?'nw':'act';g.fav=[...g.it.entries()].sort((a,b)=>b[1]-a[1])[0][0]});GC={key:ST.b,v:l};return l}
const SEGC={vip:'a',reg:'good',nw:'',act:'',lost:'bad'};
function vGuests(){
 const g=guests(),cn=['vip','reg','act','nw','lost'].map(s=>({s,n:g.filter(x=>x.seg===s).length,v:sum(g.filter(x=>x.seg===s),x=>x.s)}));
 let l=ST.gs?g.filter(x=>x.seg===ST.gs):g;
 return `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${cn.map(c=>`<button class="k" style="text-align:left${ST.gs===c.s?';border-color:var(--a)':''}" data-gs="${c.s}"><small>${t(c.s)}</small><b>${fmt(c.n)}</b><span class="d" style="color:var(--muted)">${lei(c.v)}</span></button>`).join('')}</div>
 <section class="c" style="margin-top:12px">${table('g',[{k:'mask',l:t('gu')},{k:'s',l:t('spent'),f:r=>lei(r.s)},{k:'v',l:t('visits'),f:r=>r.v},{k:'last',l:t('last'),f:r=>r.last===0?t('todayS'):r.last+' '+t('dago')},{k:'favN',l:t('fav'),f:r=>esc(r.favN)},{k:'seg',l:t('seg'),f:r=>`<span class="tag ${SEGC[r.seg]}">${t(r.seg)}</span>`}],l.map(x=>({...x,favN:nm(x.fav)})).sort((a,b)=>b.s-a.s).slice(0,120),r=>`class="cl" data-guest="${r.id}"`)}</section>`}
function vReviews(){
 const a=sel().filter(c=>c.rate),rv=a.filter(c=>c.txt!==''),dist=[5,4,3,2,1].map(n=>({n,c:a.filter(x=>x.rate===n).length}));
 const list=rv.filter(c=>ST.rf==='all'||c.rate<=3).sort((x,y)=>x.d-y.d||y.h-x.h).slice(0,40);
 return `<div class="g2"><section class="c"><div class="tools"><div class="seg"><button data-rf="all" aria-pressed="${ST.rf==='all'}">${t('allR')}</button><button data-rf="low" aria-pressed="${ST.rf==='low'}">${t('bad')}</button></div></div><div class="rev">${list.map(c=>{const pool=REV[ST.l][c.rate];return `<div class="rv"><div><span class="stars">${stars(c.rate)}</span><span>${dateS(c.dt)} · ${brName(c.b)} · ${t('tb')} ${c.tbl} · ${esc(c.w)}</span></div><p>${esc(pool[c.txt%pool.length])}</p></div>`}).join('')||`<p class="k" style="border:0">-</p>`}</div></section>
 <section class="c"><h2>${t('avgR')}</h2><div class="k" style="border:0;padding:0 0 10px"><b>${avgRate(a).toFixed(2).replace('.',',')}</b><small>${fmt(a.length)} ${t('cnt').toLowerCase()}</small></div>${rowsBar(dist.map(d=>({l:'★ '+d.n,v:d.c,f:fmt(d.c)})))}<p class="demo" style="margin:14px 0 0">${t('ex')}</p></section></div>`}
const payCalc=a=>{const c=sum(a.filter(x=>x.via==='card'),x=>x.sum),b=sum(a.filter(x=>x.via==='bank'),x=>x.sum),g=c+b,fc=c*.02,fb=b*.007,fm=g*.01;return{g,fc,fb,fm,net:g-fc-fb-fm,tip:sum(a,x=>x.tip)}};
function vMoney(){
 const a=sel(),p=payCalc(a),rows=[];const[lo,hi]=span();for(let d=lo;d<=Math.min(hi,lo+30);d++){const x=a.filter(c=>c.d===d);if(!x.length)continue;const q=payCalc(x);rows.push({d,dn:-d,date:dateS(ago(d)),g:q.g,fees:q.fc+q.fb+q.fm,net:q.net,tip:q.tip})}
 return `<div class="kpis">${k(t('turnover'),lei(p.g),'','hero')}${k(t('fees'),lei(p.fc+p.fb+p.fm))}${k(t('payout'),lei(p.net))}${k(t('tipsO'),lei(p.tip))}</div>
 <div class="g2"><section class="c"><h2>${t('po')}</h2>${table('m',[{k:'dn',l:t('date'),f:r=>r.date},{k:'g',l:t('gross'),f:r=>lei(r.g)},{k:'fees',l:t('fees'),f:r=>lei(r.fees)},{k:'net',l:t('net'),f:r=>lei(r.net)},{k:'tip',l:t('tipsT'),f:r=>lei(r.tip)}],rows)}</section>
 <section class="c"><h2>${t('fees')}</h2><div class="leg"><div><span>${t('turnover')}</span><b>${lei(p.g)}</b></div><div><span>${t('feeC')}</span><b>−${lei(p.fc)}</b></div><div><span>${t('feeB')}</span><b>−${lei(p.fb)}</b></div><div><span>${t('feeM')}</span><b>−${lei(p.fm)}</b></div><div style="border-top:1px solid var(--line);padding-top:8px"><span><b>${t('payout')}</b></span><b>${lei(p.net)}</b></div></div></section></div>`}
const V={over:vOver,tables:vTables,dishes:vDishes,staff:vStaff,guests:vGuests,reviews:vReviews,money:vMoney};
const IC={over:'M4 13h6V4H4zM14 20h6v-9h-6zM14 8h6V4h-6zM4 20h6v-4H4z',tables:'M4 8h16M6 8v11M18 8v11M9 8V5h6v3',dishes:'M5 3v8a3 3 0 0 0 3 3v7M8 3v6M11 3v8M17 3c-2 2-3 5-3 9h3v9',staff:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-5 4-7 8-7s7 2 8 7',guests:'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c.7-4 3-6 6-6s5.300 2 6 6M16 5a3 3 0 0 1 0 6M18 14c2 1 3 3 3 6',reviews:'M4 5h16v11H9l-5 4z',money:'M3 7h18v11H3zM12 15a2.500 2.500 0 1 0 0-5 2.500 2.500 0 0 0 0 5z'};
function render(){
 document.documentElement.lang=ST.l;
 document.getElementById('sub').textContent=t('sub');document.getElementById('sfoot').textContent=t('demo');
 document.getElementById('nav').innerHTML=Object.keys(V).map(v=>`<button data-v="${v}" ${ST.v===v?'aria-current="page"':''}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[v]}"/></svg>${t(v)}</button>`).join('');
 const noPeriod=ST.v==='guests';
 document.getElementById('main').innerHTML=`<div class="bar"><h1>${t(ST.v)}</h1>${noPeriod?'':`<div class="seg" role="group">${[['today','today'],['7','d7'],['30','d30'],['custom','dates']].map(([p,l])=>`<button data-p="${p}" aria-pressed="${ST.p===p}">${t(l)}</button>`).join('')}</div>${ST.p==='custom'?`<div class="dates"><label>${t('from')}<input type="date" id="from" min="${MIN}" max="${MAX}" value="${ST.from}"></label><label>${t('to')}<input type="date" id="to" min="${MIN}" max="${MAX}" value="${ST.to}"></label></div>`:''}`}${MANY?'':'<!--'}<div class="seg" role="group"><button data-b="all" aria-pressed="${ST.b==='all'}">${t('all')}</button>${BR.map((b,i)=>`<button data-b="${i}" aria-pressed="${ST.b===String(i)}">${b[ST.l]}</button>`).join('')}</div>${MANY?'':'-->'}<div class="seg" role="group"><button data-l="ru" aria-pressed="${ST.l==='ru'}">RU</button><button data-l="ro" aria-pressed="${ST.l==='ro'}">RO</button></div></div>${V[ST.v]()}`}
function drawer(title,a,extra=''){
 const rev=sum(a,c=>c.sum),top=dishStat(a).sort((x,y)=>y.n-x.n).slice(0,5),last=[...a].sort((x,y)=>x.d-y.d||y.h-x.h).slice(0,6);
 document.getElementById('over').innerHTML=`<div class="scrim" data-close></div><aside class="dr" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="x" data-close aria-label="${t('closeL')}">×</button><h2>${esc(title)}</h2>${extra}<div class="mini">${k(t('rev'),lei(rev))}${k(t('checks'),fmt(a.length))}${k(t('avg'),lei(rev/(a.length||1)))}${k(t('tips'),lei(sum(a,c=>c.tip)))}</div><section class="c"><h2>${t('top')}</h2>${rowsBar(top.map(x=>({l:nm(x.i),v:x.n,f:fmt(x.n)})))}</section><section class="c"><h2>${t('recent')}</h2><div class="leg">${last.map(c=>`<div><span>${dateS(c.dt)} ${c.h}:00 · ${c.people}×</span><b>${lei(c.sum)}</b></div>`).join('')}</div></section></aside>`;
 document.querySelector('.dr .x').focus()}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-v],[data-p],[data-b],[data-l],[data-cat],[data-sort],[data-table],[data-waiter],[data-guest],[data-close],[data-gs],[data-rf]');if(!b)return;const a=b.dataset;
 if('close' in a){document.getElementById('over').innerHTML='';return}
 if(a.v){ST.v=a.v;render();scrollTo(0,0);return}
 if(a.p){if(a.p==='custom'&&!ST.from){ST.from=iso(ago(13));ST.to=MAX}ST.p=a.p;return render()}
 if(a.b){ST.b=a.b;return render()}
 if(a.l){ST.l=a.l;try{localStorage.setItem('cab.l',a.l)}catch(x){}return render()}
 if(a.cat){ST.cat=a.cat;return render()}
 if(a.gs){ST.gs=ST.gs===a.gs?null:a.gs;return render()}
 if(a.rf){ST.rf=a.rf==='low'?'low':'all';return render()}
 if(a.sort){const[id,k]=a.sort.split(':'),s=ST.sort[id];ST.sort[id]={k,d:s&&s.k===k?-s.d:-1};return render()}
 if(a.table){const[bi,n]=a.table.split('-').map(Number);return drawer(`${t('tb')} ${n}, ${brName(bi)}`,sel().filter(c=>c.b===bi&&c.tbl===n))}
 if(a.waiter)return drawer(a.waiter,sel().filter(c=>c.w===a.waiter));
 if(a.guest){const id=+a.guest,g=guests().find(x=>x.id===id);return drawer(`${t('gu')} ${g.mask}`,C.filter(c=>c.g===id&&(ST.b==='all'||String(c.b)===ST.b)),`<span class="tag ${SEGC[g.seg]}" style="justify-self:start">${t(g.seg)}</span>`)}
});
document.addEventListener('change',e=>{if(e.target.id==='from'||e.target.id==='to'){const v=e.target.value;if(v&&v>=MIN&&v<=MAX){ST[e.target.id]=v;GC=null;render()}else render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){ST.q=e.target.value;const p=e.target.selectionStart;render();const i=document.getElementById('q');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('over').innerHTML=''});
render();
</script>

</body>
