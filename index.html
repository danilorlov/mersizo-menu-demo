<title>Mersizo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: gradient cu telefon, card negru, listă cu iconițe rotunde, carusel de carduri, exemplu, tarife, formular. */
:root{--a:#2c014f;--b:#ba66ff;--ink:#000;--muted:#5d6470;--line:#ececf1;--soft:#f6f1ff;--h:'Geologica',system-ui,sans-serif;--t:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.5 var(--t);overflow-x:hidden}
.w{max-width:640px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--h);font-weight:700;text-wrap:balance}
:focus-visible{outline:3px solid #7a3cff;outline-offset:2px}
.hero{background:linear-gradient(var(--a),var(--b));color:#fff;text-align:center;padding-block:16px 0;overflow:hidden}
.top{display:flex;justify-content:flex-end}
.langs{display:flex;gap:2px;background:rgba(255,255,255,.18);border-radius:90px;padding:3px}
.langs button{min-width:44px;min-height:38px;border:0;border-radius:90px;background:none;color:#fff;font:700 14px var(--h);cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff;color:var(--a)}
.logo{display:inline-flex;background:#fff;border-radius:20px;padding:16px 22px;margin-top:20px}
.logo svg{height:34px;width:auto;display:block}
.hero h1{font-size:clamp(34px,7vw,52px);line-height:1.12;margin-top:28px}
.hero .sub{font:500 16px/1.4 var(--h);margin-top:14px;opacity:.9}
.btns{display:grid;gap:12px;max-width:300px;margin:28px auto 0}
.pill{display:flex;align-items:center;justify-content:center;min-height:60px;padding:0 28px;border:0;border-radius:90px;font:700 17px var(--h);text-decoration:none;cursor:pointer;color:#fff;background:#000}
.pill.g{background:rgba(255,255,255,.32)}
.tent{width:min(320px,100%);margin:44px auto 0;background:#fff;color:#000;border-radius:40px 40px 0 0;padding:28px 24px 36px;display:grid;gap:14px;justify-items:center}
.tent b{font:700 19px var(--h)}
.qr{width:176px;height:176px;border:1px solid var(--line);border-radius:20px;padding:16px}
.qr svg{width:100%;height:100%;display:block}
.tent span{font:500 14px var(--t);color:var(--muted)}
section{padding-block:56px}
h2{font-size:30px;line-height:1.15}
.lab{font:700 22px var(--h);color:#7e95a6;text-align:center}
.blk{background:#000;color:#fff;border-radius:32px;padding:20px;margin-top:24px;display:grid;gap:22px}
.blk div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center}
.blk i{width:48px;height:48px;border-radius:14px;background:#26262a;display:grid;place-items:center}
.blk b{display:block;font:700 18px/1.2 var(--h)}
.blk small{font-size:14px;color:#d9d9e0}
.fe{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:32px}
.fe i{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.fe b{display:block;font:700 18px/1.25 var(--h);margin-top:16px}
.fe span{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.c1{background:linear-gradient(135deg,#f5a15a,#b93a7a);box-shadow:0 10px 40px rgba(245,161,90,.45)}
.c2{background:linear-gradient(135deg,#3f7bff,#3a3fbf);box-shadow:0 10px 40px rgba(63,123,255,.4)}
.c3{background:linear-gradient(135deg,#46c47e,#1c7a4c);box-shadow:0 10px 40px rgba(70,196,126,.4)}
.c4{background:linear-gradient(135deg,#e45bd0,#7a3cff);box-shadow:0 10px 40px rgba(228,91,208,.4)}
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:28px;padding-left:max(24px,calc((100vw - 592px)/2));padding-right:24px;padding-bottom:6px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.cd{flex:none;width:min(320px,82vw);border-radius:36px;padding:28px;background:linear-gradient(#e4e2ff,#fff);border:1px solid var(--line);scroll-snap-align:center;min-width:0}
.cd i{width:56px;height:56px;border-radius:50%;background:#000;display:grid;place-items:center}
.cd h3{font-size:22px;margin-top:18px}
.cd ul{margin:18px 0 0;padding:0 0 0 18px;font-size:15px;display:grid;gap:6px}
.soft{background:#fafafa}
.lead{color:var(--muted);margin-top:10px}
.shots{list-style:none;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:28px 0 0;padding:0 24px 6px max(24px,calc((100vw - 592px)/2));counter-reset:s;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shots li{flex:none;width:min(240px,66vw);counter-increment:s;scroll-snap-align:center}
.shots img{display:block;width:100%;aspect-ratio:390/700;object-fit:cover;object-position:top;border-radius:28px;border:6px solid #000}
.shots b{display:block;font:700 17px var(--h);margin-top:12px}
.shots span{font-size:14px;color:var(--muted)}
.tbl{margin-top:24px;border:1px solid var(--line);border-radius:28px;overflow:hidden}
.tbl div{padding:16px 20px;border-bottom:1px solid var(--line)}
.tbl div:last-child{border-bottom:0}
.tbl b{display:block;font:700 17px var(--h)}
.tbl span{font-size:15px;color:var(--muted)}
details{border-bottom:1px solid var(--line);padding-block:16px}
details:first-of-type{margin-top:16px}
summary{font:700 16px var(--h);cursor:pointer}
details p{color:var(--muted);margin-top:8px;font-size:15px}
.apply{background:linear-gradient(var(--a),var(--b));color:#fff}
.apply h2{text-align:center}
.apply .lead{color:#fff;opacity:.9;text-align:center}
form{background:#fff;color:#000;border-radius:32px;padding:24px;display:grid;gap:14px;margin-top:24px;min-width:0}
label{display:grid;gap:6px;font:500 14px var(--h);min-width:0}
input,textarea{width:100%;min-height:52px;padding:12px 16px;font:400 16px var(--t);color:#000;background:#f5f5f8;border:1px solid transparent;border-radius:16px}
textarea{min-height:96px;resize:vertical}
form .pill{width:100%}
form .pill[disabled]{opacity:.5;cursor:not-allowed}
.msg{font-size:15px;font-weight:600;text-align:center}
.msg.ok{color:#1c7a4c}.msg.err{color:#c2410c}
footer{padding-block:24px;text-align:center;color:var(--muted);font-size:14px}
@media(min-width:900px){
.w{max-width:1040px}
.hero{text-align:left}
.hero .w{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:48px;align-items:end}
.top{grid-column:1/-1}
.logo{grid-column:1;justify-self:start;margin-top:24px}
.hero h1{grid-column:1;font-size:64px;margin-top:24px}
.hero .sub{grid-column:1;font-size:19px}
.btns{grid-column:1;grid-template-columns:auto auto;justify-content:start;max-width:none;margin:28px 0 56px}
.tent{grid-column:2;grid-row:2/6;width:100%;margin:32px 0 0}
.lab{text-align:left}
h2{font-size:40px}
.blk{grid-template-columns:repeat(4,minmax(0,1fr));padding:28px}
.fe{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.car,.shots{padding-left:max(24px,calc((100vw - 992px)/2))}
.tbl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tbl div{border-bottom:0;border-right:1px solid var(--line)}
.tbl div:last-child{border-right:0}
.shots li{width:220px}
.cd{width:330px}
.apply .w{max-width:640px}
}
.pill.g2{background:#fff;color:#000;border:2px solid #000}

fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font:500 14px var(--h);margin-bottom:8px;padding:0}
.fv{display:grid;gap:16px}
.fv[hidden]{display:none}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label span b{font-weight:500}label span i{font-style:normal;color:var(--muted);font-weight:400}
select{width:100%;min-height:52px;padding:12px 16px;font:400 16px var(--t);color:#000;background:#f5f5f8;border:1px solid transparent;border-radius:16px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);background-position:calc(100% - 22px) 23px,calc(100% - 16px) 23px;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7a3cff;background:#fff;box-shadow:0 0 0 4px rgba(122,60,255,.15)}
input.bad{border-color:#c2410c;background:#fff5f0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;min-height:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:90px;background:#f5f5f8;font:500 15px var(--h);border:1px solid transparent}
.chip input:checked+span{background:#2c014f;color:#fff}
.chip input:focus-visible+span{outline:3px solid #7a3cff;outline-offset:2px}
.agree{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.done{display:grid;justify-items:center;gap:10px;text-align:center;padding:16px 0}
.done[hidden]{display:none}
.tick{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#46c47e,#1c7a4c);box-shadow:0 10px 40px rgba(70,196,126,.4)}
.done h3{font-size:24px}
.done p{color:var(--muted)}
footer b{color:#000;font-family:var(--h)}
@media(max-width:560px){.row2{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
